name: Build Windows packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build ScreenTranslator.sln -c Release
      - name: Test translation core
        run: dotnet test tests/ScreenTranslator.Core.Tests/ScreenTranslator.Core.Tests.csproj -c Release --no-build
      - name: Package Windows x64
        shell: pwsh
        run: ./scripts/publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-win-x64
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
